<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fitness Tracker Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-6">
  <div class="bg-white rounded-lg shadow-lg p-8 max-w-md w-full">
    <h1 class="text-3xl font-bold text-blue-900 mb-8 text-center">Fitness Tracker</h1>
    <div class="flex justify-around mb-12">
      <div class="text-center">
        <p class="text-sm text-blue-700 mb-2">Distance</p>
        <p class="text-2xl font-semibold text-blue-900">0.00 km</p>
      </div>
      <div class="text-center">
        <p class="text-sm text-blue-700 mb-2">Pace</p>
        <p class="text-2xl font-semibold text-blue-900">0:00 min/km</p>
      </div>
      <div class="text-center">
        <p class="text-sm text-blue-700 mb-2">Cadence</p>
        <p class="text-2xl font-semibold text-blue-900">0 spm</p>
      </div>
    </div>
    <div class="flex justify-center mb-12">
      <button class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition">Start Tracking</button>
    </div>
    <div class="bg-blue-200 rounded-lg p-4 text-center text-blue-900 font-semibold">
      AI Training Guidance: Stay steady, pace yourself!
    </div>
  </div>
</body>
</html>
